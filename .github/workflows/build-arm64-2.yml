name: Build ARM64 Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SamboyCoding/Cpp2IL
          ref: 2022.1.0-pre-release.16
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Publish linux-bionic-arm64
        run: |
          dotnet publish Cpp2IL/Cpp2IL.csproj \
            -c Release \
            -f net7.0 \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cpp2IL-android-arm64
          path: ./publish-arm64/
