name: Build ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SamboyCoding/Cpp2IL
          ref: 2022.1.0-pre-release.16
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ARM64 Linux
        run: |
          dotnet publish Cpp2IL/Cpp2IL.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cpp2IL-linux-arm64
          path: ./publish-arm64/
